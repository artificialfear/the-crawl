# The Crawl's push notifications (evening reminders and party pings), sent every 15 minutes.
# Needs one repository secret, FIREBASE_SA: the JSON of a Firebase service-account key (see HANDOFF.md → Notifications).
# Until it's set, the job just says so and stops.
name: Push notifications
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
concurrency:
  group: crawl-push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: tools/push
        run: npm install --no-audit --no-fund --omit=dev
      - name: Send
        working-directory: tools/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node send.mjs
